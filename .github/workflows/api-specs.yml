name: API Specs (topic parallel)

on:
  push:
    paths:
      - "api/**"
      - "packages/**"
      - "plugins/**"
      - ".github/workflows/api-specs.yml"
      - "AGENTS.md"
  pull_request:
    paths:
      - "api/**"
      - "packages/**"
      - "plugins/**"
      - ".github/workflows/api-specs.yml"
      - "AGENTS.md"
  workflow_dispatch:

# Cancel older runs on the same ref when new commits are pushed
concurrency:
  group: api-specs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-specs-full:
    name: "API specs (full) - ${{ matrix.topic }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include: &api_spec_topics
          # Static domains shared by full/core; see docs/agent-instructions/testing.md.
          - topic: foundation
            patterns: |
              spec/smoke/**/*_spec.rb
              spec/api/custom_routes_coverage_spec.rb
              spec/api/endpoint_coverage_spec.rb
              spec/api/generate_pending_endpoints_spec.rb
              spec/api/routes/**/*_spec.rb
              spec/models/**/*_spec.rb
              spec/supervisor/**/*_spec.rb

          - topic: plugins
            patterns: |
              spec/api/plugins/**/*_spec.rb

          - topic: dns
            patterns: |
              spec/api/resources/dns*_spec.rb

          - topic: storage
            patterns: |
              spec/api/resources/dataset_*_spec.rb
              spec/api/resources/environment_dataset_*_spec.rb
              spec/api/resources/pool_*_spec.rb
              spec/api/resources/snapshot_download_spec.rb
              spec/api/resources/export_spec.rb

          - topic: mail
            patterns: |
              spec/api/resources/mail*_spec.rb
              spec/api/resources/mailbox_spec.rb
              spec/api/resources/user_mail_*_spec.rb

          - topic: vps
            patterns: |
              spec/api/resources/vps_*_spec.rb

          - topic: platform-infrastructure
            patterns: |
              spec/api/resources/node_*_spec.rb
              spec/api/resources/os_*_spec.rb
              spec/api/resources/migration_plan_spec.rb

          - topic: platform-operations
            patterns: |
              spec/api/resources/security_advisory*_spec.rb
              spec/api/resources/oom_report*_spec.rb
              spec/api/resources/incident_report_spec.rb
              spec/api/resources/lifecycle_bypass_spec.rb
              spec/api/resources/object_history_spec.rb
              spec/api/resources/transaction*_spec.rb

          - topic: platform-config
            patterns: |
              spec/lib/**/*_spec.rb
              spec/api/resources/action_state_spec.rb
              spec/api/resources/api_server_spec.rb
              spec/api/resources/cluster*_spec.rb
              spec/api/resources/component_spec.rb
              spec/api/resources/debug_spec.rb
              spec/api/resources/default_object_cluster_resource_spec.rb
              spec/api/resources/environment_read_spec.rb
              spec/api/resources/environment_write_spec.rb
              spec/api/resources/language_spec.rb
              spec/api/resources/location_read_spec.rb
              spec/api/resources/location_write_spec.rb
              spec/api/resources/metrics_access_token_spec.rb
              spec/api/resources/system_config_spec.rb

          - topic: auth
            patterns: |
              spec/api/resources/oauth2_client_spec.rb
              spec/api/resources/password_change_log_spec.rb
              spec/api/resources/webauthn_spec.rb
              spec/api/resources/user_known_device_spec.rb
              spec/api/resources/user_public_key_spec.rb
              spec/api/resources/user_session_spec.rb
              spec/api/resources/user_totp_device_spec.rb
              spec/api/resources/user_webauthn_credential_spec.rb

          - topic: users
            patterns: |
              spec/api/resources/user_cluster_resource*_spec.rb
              spec/api/resources/user_environment_config_spec.rb
              spec/api/resources/user_namespace*_spec.rb
              spec/api/resources/user_read_spec.rb
              spec/api/resources/user_state_log_spec.rb
              spec/api/resources/user_touch_spec.rb
              spec/api/resources/user_available_ips_spec.rb
              spec/api/resources/user_write_spec.rb

          - topic: ip-ownership
            patterns: |
              spec/api/resources/ip_address*_spec.rb
              spec/api/resources/ip_release*_spec.rb

          - topic: network
            patterns: |
              spec/api/resources/network_*_spec.rb
              spec/api/resources/network_interface*_spec.rb
              spec/api/resources/host_ip_address_spec.rb
              spec/api/resources/location_network_spec.rb

    env:
      RACK_ENV: test
      # CI should not install dev-only gems (rubocop, yard, etc.)
      BUNDLE_WITHOUT: development
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      VPSADMIN_PLUGINS: all
      SPEC_MODE: full

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select spec files for topic
        working-directory: api
        env:
          TOPIC: ${{ matrix.topic }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          mkdir -p tmp
          : > "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"

          files=()
          while IFS= read -r pat; do
            [[ -z "$pat" ]] && continue
            # unquoted expansion is intentional: we want glob expansion
            for f in $pat; do
              files+=("$f")
            done
          done <<< "$PATTERNS"

          if (( ${#files[@]} == 0 )); then
            echo "ERROR: Topic '$TOPIC' matched 0 spec files."
            echo "Patterns were:"
            echo "$PATTERNS"
            exit 2
          fi

          printf '%s\n' "${files[@]}" | sort -u > "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"

          {
            echo "### API spec topic: $TOPIC"
            echo ""
            echo "Matched **$(wc -l < "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt")** spec files:"
            echo ""
            echo '```'
            cat "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spec file list (for topic coverage checks)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-files-${{ env.SPEC_MODE }}-${{ matrix.topic }}
          path: api/tmp/rspec-files-${{ env.SPEC_MODE }}-${{ matrix.topic }}.txt
          if-no-files-found: error
          retention-days: 7

      # mysql2 needs client headers; specs start an isolated MariaDB server.
      - name: Install system dependencies (MariaDB server + headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmariadb-dev \
            libmariadb-dev-compat \
            mariadb-client \
            mariadb-server

      - name: Read Ruby series
        id: ruby-version
        run: |
          set -euo pipefail
          # ruby/setup-ruby resolves exact 3.4.0 to a preview build on
          # GitHub-hosted runners, so use the latest stable 3.4.x instead.
          echo "version=$(cut -d. -f1,2 .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby (Bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby-version.outputs.version }}
          bundler-cache: true
          working-directory: api

      - name: Record RSpec environment
        working-directory: api
        env:
          TOPIC: ${{ matrix.topic }}
        run: |
          set -euo pipefail
          bundle exec ruby -rjson -rdigest -rrspec/core -e '
            evidence = {
              mode: ENV.fetch("SPEC_MODE"),
              topic: ENV.fetch("TOPIC"),
              ruby: RUBY_DESCRIPTION,
              bundler: Bundler::VERSION,
              rspec: RSpec::Core::Version::STRING,
              gemfile_lock_sha256: Digest::SHA256.file(Bundler.default_lockfile).hexdigest
            }
            File.write("tmp/rspec-environment-#{evidence[:mode]}-#{evidence[:topic]}.json",
                       JSON.pretty_generate(evidence) + "\n")
          '

      - name: Run RSpec (topic)
        working-directory: api
        env:
          TOPIC: ${{ matrix.topic }}
        run: |
          set -euo pipefail
          mapfile -t files < "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"
          if (( ${#files[@]} == 0 )); then
            echo "ERROR: Topic '$TOPIC' has an empty spec manifest."
            exit 2
          fi
          result="tmp/rspec-results-$SPEC_MODE-$TOPIC.json"
          bundle exec rspec "${files[@]}" --format documentation --format json --out "$result"
          test -s "$result"

      - name: Upload RSpec results and environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-results-${{ env.SPEC_MODE }}-${{ matrix.topic }}
          path: |
            api/tmp/rspec-results-${{ env.SPEC_MODE }}-${{ matrix.topic }}.json
            api/tmp/rspec-environment-${{ env.SPEC_MODE }}-${{ matrix.topic }}.json
          if-no-files-found: error
          retention-days: 7

  api-specs-core:
    name: "API specs (core) - ${{ matrix.topic }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include: *api_spec_topics

    env:
      RACK_ENV: test
      # CI should not install dev-only gems (rubocop, yard, etc.)
      BUNDLE_WITHOUT: development
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      VPSADMIN_PLUGINS: none
      SPEC_MODE: core

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select spec files for topic
        working-directory: api
        env:
          TOPIC: ${{ matrix.topic }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          mkdir -p tmp
          : > "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"

          files=()
          while IFS= read -r pat; do
            [[ -z "$pat" ]] && continue
            # unquoted expansion is intentional: we want glob expansion
            for f in $pat; do
              files+=("$f")
            done
          done <<< "$PATTERNS"

          if (( ${#files[@]} == 0 )); then
            echo "ERROR: Topic '$TOPIC' matched 0 spec files."
            echo "Patterns were:"
            echo "$PATTERNS"
            exit 2
          fi

          printf '%s\n' "${files[@]}" | sort -u > "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"

          {
            echo "### API spec topic: $TOPIC"
            echo ""
            echo "Matched **$(wc -l < "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt")** spec files:"
            echo ""
            echo '```'
            cat "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spec file list (for topic coverage checks)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-files-${{ env.SPEC_MODE }}-${{ matrix.topic }}
          path: api/tmp/rspec-files-${{ env.SPEC_MODE }}-${{ matrix.topic }}.txt
          if-no-files-found: error
          retention-days: 7

      # mysql2 needs client headers; specs start an isolated MariaDB server.
      - name: Install system dependencies (MariaDB server + headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmariadb-dev \
            libmariadb-dev-compat \
            mariadb-client \
            mariadb-server

      - name: Read Ruby series
        id: ruby-version
        run: |
          set -euo pipefail
          # ruby/setup-ruby resolves exact 3.4.0 to a preview build on
          # GitHub-hosted runners, so use the latest stable 3.4.x instead.
          echo "version=$(cut -d. -f1,2 .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby (Bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby-version.outputs.version }}
          bundler-cache: true
          working-directory: api

      - name: Record RSpec environment
        working-directory: api
        env:
          TOPIC: ${{ matrix.topic }}
        run: |
          set -euo pipefail
          bundle exec ruby -rjson -rdigest -rrspec/core -e '
            evidence = {
              mode: ENV.fetch("SPEC_MODE"),
              topic: ENV.fetch("TOPIC"),
              ruby: RUBY_DESCRIPTION,
              bundler: Bundler::VERSION,
              rspec: RSpec::Core::Version::STRING,
              gemfile_lock_sha256: Digest::SHA256.file(Bundler.default_lockfile).hexdigest
            }
            File.write("tmp/rspec-environment-#{evidence[:mode]}-#{evidence[:topic]}.json",
                       JSON.pretty_generate(evidence) + "\n")
          '

      - name: Run RSpec (topic)
        working-directory: api
        env:
          TOPIC: ${{ matrix.topic }}
        run: |
          set -euo pipefail
          mapfile -t files < "tmp/rspec-files-$SPEC_MODE-$TOPIC.txt"
          if (( ${#files[@]} == 0 )); then
            echo "ERROR: Topic '$TOPIC' has an empty spec manifest."
            exit 2
          fi
          result="tmp/rspec-results-$SPEC_MODE-$TOPIC.json"
          bundle exec rspec "${files[@]}" --format documentation --format json --out "$result"
          test -s "$result"

      - name: Upload RSpec results and environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-results-${{ env.SPEC_MODE }}-${{ matrix.topic }}
          path: |
            api/tmp/rspec-results-${{ env.SPEC_MODE }}-${{ matrix.topic }}.json
            api/tmp/rspec-environment-${{ env.SPEC_MODE }}-${{ matrix.topic }}.json
          if-no-files-found: error
          retention-days: 7

  api-spec-topic-coverage:
    name: "API specs - topic coverage"
    runs-on: ubuntu-latest
    needs: [api-specs-full, api-specs-core]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout (for git ls-files)
        uses: actions/checkout@v7

      - name: Download per-topic file lists
        uses: actions/download-artifact@v8
        with:
          pattern: rspec-files-*
          path: artifacts

      - name: "Validate: every spec file belongs to exactly one topic"
        if: always()
        env:
          FULL_RESULT: ${{ needs.api-specs-full.result }}
          CORE_RESULT: ${{ needs.api-specs-core.result }}
          EXPECTED_TOPICS: foundation plugins dns storage mail vps platform-infrastructure platform-operations platform-config auth users ip-ownership network
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from collections import Counter
          from pathlib import Path
          import os
          import subprocess

          errors = []
          topics = os.environ["EXPECTED_TOPICS"].split()
          if len(topics) != 13 or len(set(topics)) != 13:
              errors.append("Expected exactly thirteen distinct configured topics.")

          for mode in ("full", "core"):
              result = os.environ[f"{mode.upper()}_RESULT"]
              if result != "success":
                  errors.append(f"{mode} matrix result is {result!r}, expected 'success'.")

          # Migration specs continue through their separate workflow.
          eligible = set(subprocess.check_output([
              "git", "-C", "api", "ls-files", "spec/**/*_spec.rb",
              ":!spec/migrations/*_spec.rb"
          ], text=True).splitlines())
          artifacts = Path("artifacts")
          expected_artifacts = {
              f"rspec-files-{mode}-{topic}" for mode in ("full", "core") for topic in topics
          }
          actual_artifacts = {path.name for path in artifacts.iterdir()} if artifacts.is_dir() else set()
          for name in sorted(actual_artifacts - expected_artifacts):
              errors.append(f"Unexpected manifest artifact: {name}")

          manifests = {}
          for mode in ("full", "core"):
              mapped = []
              for topic in topics:
                  name = f"rspec-files-{mode}-{topic}"
                  directory = artifacts / name
                  manifest = directory / f"{name}.txt"
                  if not directory.is_dir() or directory.is_symlink():
                      errors.append(f"Missing manifest artifact directory: {name}")
                      continue
                  if set(directory.iterdir()) != {manifest} or not manifest.is_file() or manifest.is_symlink():
                      errors.append(f"Expected exactly one unnested manifest file in {name}.")
                      continue
                  files = manifest.read_text().splitlines()
                  if not files or any(not path.strip() for path in files):
                      errors.append(f"Empty manifest or blank spec path: {name}")
                      continue
                  manifests[mode, topic] = files
                  mapped.extend(files)
              counts = Counter(mapped)
              duplicates = sorted(path for path, count in counts.items() if count > 1)
              missing = sorted(eligible - set(mapped))
              extra = sorted(set(mapped) - eligible)
              for label, paths in (("Duplicate", duplicates), ("Missing", missing), ("Untracked", extra)):
                  if paths:
                      errors.append(f"{mode}: {label} spec paths:\n" + "\n".join(paths))
              print(f"{mode}: {sum((mode, topic) in manifests for topic in topics)} manifests, "
                    f"{len(mapped)} mapped paths, {len(eligible)} eligible specs")

          for topic in topics:
              full = manifests.get(("full", topic))
              core = manifests.get(("core", topic))
              if full is not None and core is not None and sorted(full) != sorted(core):
                  errors.append(f"Full/core manifests disagree for topic {topic}.")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              raise SystemExit(1)

          message = "OK: both successful matrices cover every eligible API spec exactly once."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Topic coverage\n\n- Eligible API spec files: **{len(eligible)}**\n"
                            f"- Nonempty topics per mode: **{len(topics)}**\n\n{message}\n")
          PYTHON
